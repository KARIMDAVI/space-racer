<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Racer</title>
    <link rel="stylesheet" href="./style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 3D Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="uiContainer">
      <!-- HUD -->
      <div id="hud">
        <div class="score-display">
          DISTANCE: <span id="scoreValue">0</span>
          <!-- Written by HUD off tierChanged and off the run starting; the markup value is
               only what shows for the instant before the first render. -->
          <span id="sectorValue" class="sector">SECTOR 01</span>
          <!-- Empty and at opacity 0 until a graze or an orb fills it. HUD drives it with the
               Web Animations API rather than a CSS class, so a second bonus arriving mid-flash
               restarts cleanly instead of needing a forced reflow to retrigger the animation. -->
          <span id="bonusFlash" class="bonus-flash"></span>
        </div>
        <!-- Label and aria-pressed are both written by HUD from the persisted state at
             boot; the markup value is only what shows for the instant before that. -->
        <button id="muteButton" class="hud-button" type="button" aria-pressed="false">SOUND ON</button>
      </div>

      <!-- Active power-ups. Each chip is hidden until HUD hears powerupStarted for its kind and
           carries its own colour, so the readout is legible at a glance without reading it. -->
      <div id="powerupBar">
        <span id="powerupShield" class="powerup-chip shield hidden"></span>
        <span id="powerupMagnet" class="powerup-chip magnet hidden"></span>
        <span id="powerupHyperdrive" class="powerup-chip hyperdrive hidden"></span>
      </div>

      <!-- Start Screen -->
      <div id="startScreen" class="overlay-screen">
        <h1 class="glow-text title">NEON RIDER</h1>
        <p class="subtitle">LEFT/RIGHT arrows, A/D, or hold either side of the screen.</p>
        <p class="subtitle">Dodge the obstacles. Collect the orbs.</p>
        <button id="startButton" class="glow-button">START ENGINE</button>
      </div>

      <!-- Pause Screen -->
      <div id="pauseScreen" class="overlay-screen hidden">
        <h1 class="glow-text title">PAUSED</h1>
        <p class="subtitle">Press ESC to resume.</p>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverScreen" class="overlay-screen hidden">
        <h1 class="glow-text danger">SYSTEM FAILURE</h1>
        <p class="subtitle">FINAL DISTANCE: <span id="finalScore">0</span></p>
        <p class="subtitle"><span id="bestLabel">BEST</span>: <span id="bestScore">0</span></p>
        <button id="restartButton" class="glow-button">REBOOT</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
